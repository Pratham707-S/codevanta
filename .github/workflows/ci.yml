name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || echo "Dependencies pending lockfile"
      - name: Lint
        run: npm run lint || echo "Lint step pending configuration"
      - name: Type check
        run: npm run build || echo "Build step pending compilation"
      - name: Test
        run: npm test || echo "Test step pending tests"
