name: Bug Report
description: Report an issue or bug in RepoGuard
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue in RepoGuard!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps or commands to reproduce the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node version, OS, RepoGuard version.
    validations:
      required: false
